name: CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Gate 2 - Lint (black, flake8, isort)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mortgage-data-platform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Linter Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black==23.12.1 flake8==7.0.0 isort==5.13.2

      - name: Run Black
        run: black --check src tests

      - name: Run Flake8
        run: flake8 src tests --max-line-length=120 --exclude=.venv

      - name: Run isort
        run: isort --check-only --profile=black src tests

  test:
    name: Gate 3 - Unit Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mortgage-data-platform
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest with Coverage
        run: pytest tests/unit/ --cov=src --cov-fail-under=70

      - name: Upload Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/mortgage-data-platform/.coverage
